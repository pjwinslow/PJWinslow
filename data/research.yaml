# Research projects shown in the Research section, in display order.
- title: "Characterization of *de novo* primordial-like proteins"
  points:
    - "Libraries of proteins built from reduced amino acid alphabets act as models for primordial proteins."
    - "Optimized the expression and purification of more than 40 *de novo* proteins from these libraries in *E. coli*."
    - "Characterized their biophysics with circular dichroism, X-ray crystallography, and nuclear magnetic resonance."
    - "Measured the kinetics of more than 20 *de novo* proteins with ultrafiltration binding assays using radiolabeled adenosine triphosphate."
    - "Identified the functional core of a *de novo* variant of interest with protein machine learning and rational design."

